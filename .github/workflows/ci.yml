name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to catch breaking changes in the :latest images.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  ISTIO_VERSION: 1.32.0
  ISTIOCTL_SHA256: 4771175dec92527cd90ddc7edb3b3abcb32ca2f3bc32b31aa31e0b12ad36f897

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bstraehle/kubernetes
          path: kubernetes
      - name: Install istioctl
        run: |
          curl -fsSLo istioctl.tar.gz "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/istioctl-${ISTIO_VERSION}-linux-amd64.tar.gz"
          echo "${ISTIOCTL_SHA256}  istioctl.tar.gz" | sha256sum --check
          tar -xzf istioctl.tar.gz && sudo mv istioctl /usr/local/bin/
      - run: |
          kubectl kustomize manifests > istio.yaml
          kubectl kustomize kubernetes/manifests > apps.yaml
      - run: istioctl analyze --use-kube=false --failure-threshold Warning -n demo istio.yaml apps.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bstraehle/kubernetes
          path: kubernetes
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          # Cluster teardown occasionally fails on hosted runners after all checks passed.
          ignore_failed_clean: true
      - name: Install Istio
        run: |
          curl -fsSLo istioctl.tar.gz "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/istioctl-${ISTIO_VERSION}-linux-amd64.tar.gz"
          echo "${ISTIOCTL_SHA256}  istioctl.tar.gz" | sha256sum --check
          tar -xzf istioctl.tar.gz && sudo mv istioctl /usr/local/bin/
          istioctl install --set profile=demo --set components.cni.enabled=true -y
      - name: Deploy apps and Istio policies
        run: |
          # Label the namespace before the apps exist, so every pod gets a
          # sidecar from the start and no pre-injection pods are left around.
          kubectl apply -f kubernetes/manifests/namespace.yaml
          kubectl label namespace demo istio-injection=enabled
          kubectl apply -k kubernetes/manifests
          kubectl apply -k manifests
          kubectl -n demo rollout status deployment/rest-api --timeout=300s
          kubectl -n demo rollout status deployment/mvc-app --timeout=300s
      - run: istioctl analyze -n demo --failure-threshold Warning
      - name: Check allowed traffic through the ingress gateway
        run: |
          kubectl -n istio-system port-forward service/istio-ingressgateway 8080:80 &
          for url in http://localhost:8080/ http://localhost:8080/Demo/List; do
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 10 -o /dev/null "$url"
            echo "OK $url"
          done
      - name: Check add, update, and delete through the MVC forms
        run: bash .github/e2e/form-flow.sh http://localhost:8080
      - name: Check denied traffic from other workloads
        run: |
          kubectl apply -f .github/e2e/probe-pod.yaml
          kubectl -n demo wait --for=condition=Ready pod/probe --timeout=180s
          for target in rest-api-service:8001/Demo mvc-app-service:8000/; do
            code=$(kubectl -n demo exec probe -c curl -- curl -s -o /dev/null -m 10 -w '%{http_code}' "http://${target}" || true)
            echo "${target} -> ${code}"
            test "${code}" = 403
          done
      - if: failure()
        run: |
          kubectl -n demo get all,events
          kubectl -n demo describe pods
          kubectl -n istio-system get pods
