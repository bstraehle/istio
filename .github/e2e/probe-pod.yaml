# In-mesh client used by CI to check that AuthorizationPolicies deny other workloads.
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: demo
spec:
  serviceAccountName: default
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.17.0
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
